name: JANUS Commerce Integrity

on:
  pull_request:
    paths:
      - 'COMMERCE_READINESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'PAYMENT_POLICY.md'
      - 'runtime/commerce_authority.py'
      - 'runtime/ethereum_usdt_observer.py'
      - 'runtime/purchase_ledger.py'
      - 'runtime/commerce_search_executor.py'
      - 'runtime/paid_search_packet.py'
      - 'schemas/grant.schema.json'
      - 'schemas/execution-grant.schema.json'
      - 'schemas/payment-receipt.schema.json'
      - 'schemas/market-home-buyer-query-packet.schema.json'
      - 'tests/test_commerce_authority.py'
      - 'tests/test_ethereum_usdt_observer.py'
      - 'tests/test_ethereum_usdt_transaction_observer.py'
      - 'tests/test_purchase_ledger.py'
      - 'tests/test_commerce_search_executor.py'
      - 'tests/test_paid_search_packet.py'
      - '.github/workflows/commerce-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'COMMERCE_READINESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'PAYMENT_POLICY.md'
      - 'runtime/commerce_authority.py'
      - 'runtime/ethereum_usdt_observer.py'
      - 'runtime/purchase_ledger.py'
      - 'runtime/commerce_search_executor.py'
      - 'runtime/paid_search_packet.py'
      - 'schemas/grant.schema.json'
      - 'schemas/execution-grant.schema.json'
      - 'schemas/payment-receipt.schema.json'
      - 'schemas/market-home-buyer-query-packet.schema.json'
      - 'tests/test_commerce_authority.py'
      - 'tests/test_ethereum_usdt_observer.py'
      - 'tests/test_ethereum_usdt_transaction_observer.py'
      - 'tests/test_purchase_ledger.py'
      - 'tests/test_commerce_search_executor.py'
      - 'tests/test_paid_search_packet.py'
      - '.github/workflows/commerce-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile commerce runtime
        run: |
          python -m py_compile \
            runtime/commerce_authority.py \
            runtime/ethereum_usdt_observer.py \
            runtime/purchase_ledger.py \
            runtime/commerce_search_executor.py \
            runtime/paid_search_packet.py
      - name: JSON syntax
        run: |
          python -m json.tool COMMERCE_READINESS.json >/dev/null
          python -m json.tool ORDER_EXECUTION_MATRIX.json >/dev/null
          python -m json.tool schemas/grant.schema.json >/dev/null
          python -m json.tool schemas/execution-grant.schema.json >/dev/null
          python -m json.tool schemas/payment-receipt.schema.json >/dev/null
          python -m json.tool schemas/market-home-buyer-query-packet.schema.json >/dev/null
      - name: Commerce adversarial tests
        run: |
          python -m pytest -q \
            tests/test_commerce_authority.py \
            tests/test_ethereum_usdt_observer.py \
            tests/test_ethereum_usdt_transaction_observer.py \
            tests/test_purchase_ledger.py \
            tests/test_commerce_search_executor.py \
            tests/test_paid_search_packet.py
      - name: Fail-closed canonical truth
        run: |
          python - <<'PY'
          import json
          readiness=json.load(open('COMMERCE_READINESS.json',encoding='utf-8'))
          witness=json.load(open('FOREIGN_AGENT_WITNESS.json',encoding='utf-8'))
          assert witness['foreign_agent_witness'] is False, 'Update this rule only after a real persistent foreign-agent witness.'
          assert readiness['money_enabled'] is False
          assert readiness['autonomous_purchase_declared'] is False
          assert readiness['status']=='PREPARED_BLOCKED_BY_FOREIGN_AGENT_WITNESS'
          assert readiness['payment_rail']['required_confirmations'] >= 12
          assert readiness['closed_skus']['JANUS.INFERENCE'].startswith('CLOSED_')
          assert readiness['closed_skus']['JANUS.COMPUTE'].startswith('CLOSED_')
          print('PAID_SEARCH_PIPELINE_CONTRACT=ARMED_TESTABLE')
          print('LIVE_MONEY=FAIL_CLOSED_PENDING_REAL_FOREIGN_AGENT_WITNESS')
          PY
