name: JANUS Commerce Integrity

on:
  pull_request:
    paths:
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'BUYER_QUERY_PLANE.json'
      - 'MACHINE_INGRESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'PAYMENT_POLICY.md'
      - 'PRICING.json'
      - 'BTT_PAYMENT_ROUTE.json'
      - 'PAID_QUEUE_POLICY.json'
      - 'products/JANUS.SEARCH.json'
      - 'runtime/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/workflows/commerce-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'BUYER_QUERY_PLANE.json'
      - 'MACHINE_INGRESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'PAYMENT_POLICY.md'
      - 'PRICING.json'
      - 'BTT_PAYMENT_ROUTE.json'
      - 'PAID_QUEUE_POLICY.json'
      - 'products/JANUS.SEARCH.json'
      - 'runtime/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/workflows/commerce-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure pytest is available
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile commerce runtime
        run: |
          python -m py_compile \
            runtime/commerce_authority.py \
            runtime/ethereum_usdt_observer.py \
            runtime/purchase_ledger.py \
            runtime/commerce_search_executor.py \
            runtime/paid_search_packet.py \
            runtime/paid_search_checkout.py \
            runtime/paid_search_settlement.py \
            runtime/paid_search_queue.py \
            runtime/persistent_home_foreign_witness.py \
            runtime/btt_paid_search_checkout.py \
            runtime/tron_btt_observer.py \
            runtime/btt_paid_search_settlement.py

      - name: JSON syntax
        run: |
          for f in COMMERCE_READINESS.json FOREIGN_AGENT_WITNESS.json BUYER_QUERY_PLANE.json MACHINE_INGRESS.json PRICING.json BTT_PAYMENT_ROUTE.json PAID_QUEUE_POLICY.json products/JANUS.SEARCH.json ORDER_EXECUTION_MATRIX.json schemas/grant.schema.json schemas/execution-grant.schema.json schemas/payment-receipt.schema.json schemas/btt-payment-receipt.schema.json schemas/market-home-buyer-query-packet.schema.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Commerce, queue and dual-rail adversarial tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_commerce_authority.py \
            tests/test_ethereum_usdt_observer.py \
            tests/test_ethereum_usdt_transaction_observer.py \
            tests/test_purchase_ledger.py \
            tests/test_commerce_search_executor.py \
            tests/test_paid_search_packet.py \
            tests/test_paid_search_checkout.py \
            tests/test_paid_search_settlement.py \
            tests/test_paid_search_queue.py \
            tests/test_persistent_home_foreign_witness.py \
            tests/test_btt_payment_route.py \
            tests/test_btt_paid_search_checkout.py \
            tests/test_tron_btt_observer.py

      - name: Validate queue pricing and scheduling contract
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from runtime.paid_search_checkout import search_price_usdt_micros
          p=json.load(open('PRICING.json',encoding='utf-8'))
          q=json.load(open('PAID_QUEUE_POLICY.json',encoding='utf-8'))
          assert q['queue_levels']==5 and q['max_active_paid_search']==1 and q['preemption'] is False
          assert q['current_execution_can_be_interrupted_by_higher_tier'] is False
          levels=p['products']['JANUS.SEARCH']['queue_levels']
          for level in range(1,6):
              ps=levels[str(level)]; qs=q['levels'][str(level)]
              assert ps['code']==qs['code']
              assert ps['multiplier_bps']==qs['price_multiplier_bps']
              expected=(50_000*10_000*qs['price_multiplier_bps'])//100_000_000
              assert search_price_usdt_micros(p,mode='FAST',queue_level=level)==expected
          print('PAID_SEARCH_QUEUE_PRICING_BINDING=PASS')
          PY

      - name: Validate buyer-query dual state machine
        run: PYTHONPATH=. python tools/validate_buyer_query_plane.py

      - name: Live read-only Ethereum mainnet RPC quorum smoke
        run: |
          python - <<'PY'
          from runtime.ethereum_usdt_observer import JsonRpc, hex_int
          from runtime.paid_search_settlement import DEFAULT_RPC_URLS, RPC_QUORUM, _rpc_label
          healthy=[]; failed=[]
          for url in DEFAULT_RPC_URLS:
              label=_rpc_label(url)
              try:
                  rpc=JsonRpc(url,timeout=15)
                  chain=hex_int(rpc.call('eth_chainId',[])); latest=hex_int(rpc.call('eth_blockNumber',[]))
                  if chain != 1 or latest <= 1_000_000: raise RuntimeError('unexpected chain/tip')
                  healthy.append((label,latest))
              except Exception as exc: failed.append((label,type(exc).__name__))
          print('ETHEREUM_RPC_HEALTHY=' + str(healthy)); print('ETHEREUM_RPC_FAILED=' + str(failed))
          assert len(healthy) >= RPC_QUORUM
          print('ETHEREUM_MAINNET_RPC_QUORUM=PASS')
          PY

      - name: Live Binance BTTCUSDT order-book oracle smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          from runtime.btt_paid_search_checkout import fetch_bttusdt_oracle
          o=fetch_bttusdt_oracle(timeout=15)
          assert o['provider']=='BINANCE_SPOT_PUBLIC_BOOK_TICKER'
          assert o['symbol']=='BTTCUSDT'
          assert o['exchange_ticker']=='BTTC'
          assert o['payment_asset']=='BTT'
          assert float(o['bid_price']) > 0
          assert float(o['ask_price']) >= float(o['bid_price'])
          assert float(o['price']) > 0
          assert float(o['spread_bps']) <= float(o['max_spread_bps'])
          print('BITTORRENT_TOKEN_ORACLE=PASS')
          print('BINANCE_SYMBOL=' + o['symbol'])
          print('BTT_PRICE_USDT=' + o['price'])
          PY

      - name: Live TRON solidified endpoint smoke
        env:
          TRON_PRO_API_KEY: ${{ secrets.TRON_PRO_API_KEY }}
        run: |
          PYTHONPATH=. python - <<'PY'
          from runtime.tron_btt_observer import TronHttp
          block=TronHttp(timeout=15).post('/walletsolidity/getnowblock',{})
          raw=(block.get('block_header') or {}).get('raw_data') or {}
          assert int(raw.get('number') or 0) > 1_000_000
          print('TRON_SOLIDIFIED_ENDPOINT=PASS')
          print('TRON_SOLID_BLOCK=' + str(raw['number']))
          PY

      - name: Validate seller-live and witness-independent truth
        run: |
          python - <<'PY'
          import json
          r=json.load(open('COMMERCE_READINESS.json')); w=json.load(open('FOREIGN_AGENT_WITNESS.json')); p=json.load(open('products/JANUS.SEARCH.json'))
          assert r['seller_commerce_authorized'] is True and r['money_enabled'] is True and r['autonomous_purchase_declared'] is True
          assert r['required_live_gates']['foreign_agent_witness_is_seller_prerequisite'] is False
          assert p['machine_purchase'] is True and p['live_gate']['checkout_live'] is True and p['live_gate']['paid_queue_live'] is True
          assert w['foreign_agent_witness'] in (True,False)
          assert r['closed_skus']['JANUS.INFERENCE'].startswith('CLOSED_') and r['closed_skus']['JANUS.COMPUTE'].startswith('CLOSED_')
          print('PAID_SEARCH_SELLER=LIVE')
          print('FOREIGN_AGENT_WITNESS=' + ('TRUE' if w['foreign_agent_witness'] else 'FALSE_PENDING_REAL_EVIDENCE'))
          PY

      - name: Final authority ceiling
        run: |
          python - <<'PY'
          import json
          p=json.load(open('products/JANUS.SEARCH.json'))
          assert p['authority']['payment_is_authority'] is False
          assert p['authority']['command_authority'] is False
          assert p['authority']['shell_authority'] is False
          assert p['authority']['secret_access'] is False
          assert p['authority']['external_effect_authority'] is False
          print('PAYMENT_COMMAND_AUTHORITY=FALSE')
          PY
