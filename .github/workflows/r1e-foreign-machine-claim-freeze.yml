name: JANUS R1E Foreign Machine Claim Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/persistent_home_foreign_witness.py'
      - 'tests/test_persistent_home_foreign_witness.py'
      - '.github/workflows/r1e-foreign-machine-claim-freeze.yml'
      - '.github/workflows/r1e-persistent-home-foreign-witness.yml'
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and test persistent HOME foreign-witness contract
        run: |
          set -euo pipefail
          python -m py_compile runtime/persistent_home_foreign_witness.py tests/test_persistent_home_foreign_witness.py
          PYTHONPATH=. python -m pytest -q tests/test_persistent_home_foreign_witness.py

  freeze-claim:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[JANUS R1B BUYER QUERY SHADOW]') &&
      github.event.issue.user.login != github.repository_owner
    needs: contract
    concurrency:
      group: janus-market-home-outbox-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout canonical Market
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse and validate optional machine discovery claim
        id: claim
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/r1e-live
          python - <<'PY'
          import json, os, pathlib
          from runtime.persistent_home_foreign_witness import build_ingress_claim_receipt
          payload=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          issue=payload['issue']; body=str(issue.get('body') or '')
          begin='<!-- JANUS_DISCOVERY_WITNESS_JSON'; end='JANUS_DISCOVERY_WITNESS_JSON -->'
          s=body.find(begin); e=body.find(end)
          if s < 0 or e < 0 or e <= s:
              pathlib.Path('runtime/r1e-live/status.json').write_text(json.dumps({'found':False})+'\n')
              print('R1E_MACHINE_DISCOVERY_CLAIM=ABSENT_NOT_AN_ERROR')
              raise SystemExit(0)
          claim=json.loads(body[s+len(begin):e].strip())
          policy=json.load(open('runtime/FOREIGN_AGENT_WITNESS_POLICY.json',encoding='utf-8'))
          receipt=build_ingress_claim_receipt(
              issue=issue,
              discovery_claim=claim,
              policy=policy,
              repository_id=int(payload['repository']['id']),
          )
          pathlib.Path('runtime/r1e-live/claim-receipt.json').write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          pathlib.Path('runtime/r1e-live/status.json').write_text(
              json.dumps({'found':True,'issue_id':receipt['issue_id'],'issue_number':receipt['issue_number'],'receipt_hash':receipt['receipt_hash']},sort_keys=True)+'\n')
          print('R1E_MACHINE_DISCOVERY_CLAIM=VALID_FROZEN_INPUT')
          print('R1E_PROMOTION_AUTHORITY=FALSE')
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('runtime/r1e-live/status.json'))
          print('found=' + ('true' if s.get('found') else 'false'))
          print('issue_id=' + str(s.get('issue_id') or ''))
          print('issue_number=' + str(s.get('issue_number') or ''))
          PY

      - name: No machine discovery claim supplied
        if: steps.claim.outputs.found != 'true'
        run: |
          echo 'R1E_CLAIM_FREEZE=NOT_APPLICABLE'
          echo 'PUBLIC_SEARCH_SERVICE_REMAINS_AVAILABLE=TRUE'
          echo 'FOREIGN_AGENT_WITNESS_PROMOTION=FALSE'

      - name: Persist create-only ingress claim beside public Market outbox
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JANUS R1E Foreign Claim Freeze"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          outbox="$RUNNER_TEMP/r1e-market-home-outbox"
          rm -rf "$outbox"
          if git ls-remote --exit-code --heads origin janus/market-home-outbox >/dev/null 2>&1; then
            git fetch origin janus/market-home-outbox:refs/remotes/origin/janus/market-home-outbox
            git worktree add -B r1e-outbox-local "$outbox" origin/janus/market-home-outbox
          else
            echo 'R1E_OUTBOX_BRANCH_REQUIRED_FOR_PUBLIC_SEARCH' >&2
            exit 2
          fi
          issue_id='${{ steps.claim.outputs.issue_id }}'
          target="$outbox/.janus/market-home-outbox/public-witness-claims/issue-${issue_id}.json"
          mkdir -p "$(dirname "$target")"
          if [ -f "$target" ]; then
            if ! cmp -s runtime/r1e-live/claim-receipt.json "$target"; then
              echo 'R1E_INGRESS_CLAIM_CREATE_ONLY_CONFLICT=TRUE' >&2
              exit 3
            fi
            echo 'R1E_INGRESS_CLAIM=IDEMPOTENT_REPLAY'
          else
            cp runtime/r1e-live/claim-receipt.json "$target"
            git -C "$outbox" add ".janus/market-home-outbox/public-witness-claims/issue-${issue_id}.json"
            git -C "$outbox" commit -m "R1E freeze external machine claim issue ${issue_id}"
            git -C "$outbox" push origin HEAD:refs/heads/janus/market-home-outbox
            echo 'R1E_INGRESS_CLAIM=CREATE_ONLY_PASS'
          fi
          echo 'R1E_MONEY_ENABLED=FALSE'
          echo 'R1E_CLAIM_IS_NOT_WITNESS=TRUE'
