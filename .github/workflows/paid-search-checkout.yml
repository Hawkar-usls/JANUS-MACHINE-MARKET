name: JANUS Paid SEARCH Checkout

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/commerce_authority.py'
      - 'runtime/ethereum_usdt_observer.py'
      - 'runtime/purchase_ledger.py'
      - 'runtime/paid_search_packet.py'
      - 'runtime/paid_search_checkout.py'
      - 'runtime/paid_search_settlement.py'
      - 'runtime/paid_search_queue.py'
      - 'tests/test_paid_search_packet.py'
      - 'tests/test_paid_search_checkout.py'
      - 'tests/test_paid_search_settlement.py'
      - 'tests/test_paid_search_queue.py'
      - 'PRICING.json'
      - 'PAID_QUEUE_POLICY.json'
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'products/JANUS.SEARCH.json'
      - 'docs/PAID_SEARCH_TERMS.md'
      - '.github/ISSUE_TEMPLATE/janus-paid-search.md'
      - '.github/workflows/paid-search-checkout.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/commerce_authority.py'
      - 'runtime/ethereum_usdt_observer.py'
      - 'runtime/purchase_ledger.py'
      - 'runtime/paid_search_packet.py'
      - 'runtime/paid_search_checkout.py'
      - 'runtime/paid_search_settlement.py'
      - 'runtime/paid_search_queue.py'
      - 'tests/test_paid_search_packet.py'
      - 'tests/test_paid_search_checkout.py'
      - 'tests/test_paid_search_settlement.py'
      - 'tests/test_paid_search_queue.py'
      - 'PRICING.json'
      - 'PAID_QUEUE_POLICY.json'
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'products/JANUS.SEARCH.json'
      - 'docs/PAID_SEARCH_TERMS.md'
      - '.github/ISSUE_TEMPLATE/janus-paid-search.md'
      - '.github/workflows/paid-search-checkout.yml'
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

env:
  PAID_QUEUE_STATUS_URL: https://raw.githubusercontent.com/Hawkar-usls/JANUS-MACHINE-MARKET/janus/market-state/state/commerce/paid-search-queue/QUEUE_STATUS.json

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile paid checkout and queue runtime
        run: |
          python -m py_compile runtime/commerce_authority.py runtime/ethereum_usdt_observer.py runtime/purchase_ledger.py runtime/paid_search_packet.py runtime/paid_search_checkout.py runtime/paid_search_settlement.py runtime/paid_search_queue.py
      - name: Run paid checkout contract tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_commerce_authority.py tests/test_ethereum_usdt_transaction_observer.py tests/test_paid_search_packet.py tests/test_paid_search_checkout.py tests/test_paid_search_settlement.py tests/test_paid_search_queue.py
      - name: Queue pricing and authority integrity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('PRICING.json',encoding='utf-8'))['products']['JANUS.SEARCH']['queue_levels']
          q=json.load(open('PAID_QUEUE_POLICY.json',encoding='utf-8'))
          assert q['queue_levels']==5 and q['max_active_paid_search']==1 and q['preemption'] is False
          assert q['capacity_limit_applies_at']=='INVOICE_ADMISSION'
          assert q['valid_paid_settlement_can_be_rejected_for_capacity'] is False
          assert int(q['invoice_reservation_grace_minutes']) >= 0
          for level,spec in q['levels'].items():
              assert int(p[level]['multiplier_bps'])==int(spec['price_multiplier_bps'])
              assert p[level]['code']==spec['code']
          print('PAID_QUEUE_PRICE_BINDING=PASS')
          print('PAID_QUEUE_MAX_ACTIVE=1')
          print('PAID_QUEUE_PREEMPTION=FALSE')
          print('PAID_QUEUE_CAPACITY_GATE=BEFORE_INVOICE')
          print('VALID_PAID_SETTLEMENT_CAPACITY_REJECTION=FALSE')
          PY
      - name: Assert no transaction signing or sending code
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=['runtime/ethereum_usdt_observer.py','runtime/paid_search_checkout.py','runtime/paid_search_settlement.py','runtime/paid_search_packet.py','runtime/paid_search_queue.py']
          text='\n'.join(Path(x).read_text() for x in paths).lower()
          assert 'eth_sendrawtransaction' not in text
          assert 'private_key' not in text
          print('CHECKOUT_SIGNS_OR_SENDS_TRANSACTIONS=FALSE')
          PY

  issue-invoice:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[JANUS PAID SEARCH]') &&
      github.event.issue.user.login != github.repository_owner
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mount persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-paid-state"
          rm -rf "$state"
          git worktree add -B janus-market-paid-state "$state" origin/janus/market-state
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"
      - name: Normalize request, reserve queue capacity, then create or recover exact invoice
        id: invoice
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from runtime.commerce_authority import CommerceBlocked
          from runtime.paid_search_checkout import checkout_gate, issue_invoice, verify_invoice
          from runtime.paid_search_packet import normalize_paid_issue_request
          from runtime.paid_search_queue import QueueInvalid, reserve_invoice_slot
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          issue=event['issue']; body=str(issue.get('body') or '')
          a='<!-- JANUS_PAID_SEARCH_JSON'; b='JANUS_PAID_SEARCH_JSON -->'
          s=body.find(a); e=body.find(b)
          if s<0 or e<0 or e<=s: raise SystemExit('JANUS_PAID_SEARCH_JSON_MARKER_MISSING')
          raw=json.loads(body[s+len(a):e].strip())
          if set(raw)-{'schema','message_text','queue_level'}: raise SystemExit('PAID_SEARCH_REQUEST_UNKNOWN_FIELDS')
          request=normalize_paid_issue_request(issue,raw,owner_login=event['repository']['owner']['login'])
          readiness=json.load(open('COMMERCE_READINESS.json'))
          witness=json.load(open('FOREIGN_AGENT_WITNESS.json'))
          product=json.load(open('products/JANUS.SEARCH.json'))
          try:
              checkout_gate(readiness=readiness,witness=witness,product=product)
          except CommerceBlocked as exc:
              print('live=false'); print('new=false'); print('reason='+str(exc).replace('\n',' ')); raise SystemExit(0)
          state=Path(os.environ['MARKET_STATE']); now=datetime.now(timezone.utc)
          target=state/'state/commerce/invoices'/f"issue-{issue['id']}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          if target.exists():
              record=json.loads(target.read_text())
              if record.get('request')!=request: raise SystemExit('PAID_SEARCH_INVOICE_CREATE_ONLY_REQUEST_CONFLICT')
              verify_invoice(record['invoice'],request); new=False
          else:
              inv=issue_invoice(request=request,pricing=json.load(open('PRICING.json')),issued_at=now)
              record={'schema':'janus.machine_market.paid_search_invoice_record.v1','issue_id':int(issue['id']),'issue_number':int(issue['number']),'issue_url':issue['html_url'],'buyer_login':issue['user']['login'],'request':request,'invoice':inv}
              new=True
          queue_policy=json.load(open('PAID_QUEUE_POLICY.json',encoding='utf-8'))
          try:
              reserved=reserve_invoice_slot(state,request=request,invoice=record['invoice'],policy=queue_policy,now=now)
          except QueueInvalid as exc:
              if new:
                  print('live=false'); print('new=false'); print('reason='+str(exc).replace('\n',' ')); raise SystemExit(0)
              raise
          if new:
              target.write_text(json.dumps(record,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          Path('runtime/paid-invoice-record.json').write_text(json.dumps(record,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          inv=record['invoice']; cap=reserved['capacity']
          print('live=true'); print('new='+('true' if new else 'false')); print('invoice_id='+inv['invoice_id']); print('amount='+str(inv['amount_usdt_micros'])); print('expires_at='+inv['expires_at']); print('receiver='+inv['receiving_address']); print('queue_level='+str(inv['queue_level'])); print('queue_code='+str(inv['queue_code'])); print('reservation='+reserved['reservation']); print('slots_available='+str(cap['slots_available'])); print('buyer_pending='+str(cap.get('buyer_pending') or 0))
          PY
      - name: Commit immutable invoice and queue reservation atomically
        if: steps.invoice.outputs.live == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$MARKET_STATE" config user.name "JANUS Paid Search State"
          git -C "$MARKET_STATE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$MARKET_STATE" add state/commerce/invoices state/commerce/paid-search-queue/reservations
          if git -C "$MARKET_STATE" diff --cached --quiet; then
            echo 'PAID_INVOICE_QUEUE_RESERVATION=IDEMPOTENT_REPLAY'
          else
            git -C "$MARKET_STATE" commit -m "Paid SEARCH invoice reservation ${{ steps.invoice.outputs.invoice_id }}"
            git -C "$MARKET_STATE" push origin HEAD:refs/heads/janus/market-state
            echo 'PAID_INVOICE_QUEUE_RESERVATION=PASS'
          fi
      - name: Tell requester checkout is still fail-closed
        if: steps.invoice.outputs.live != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.invoice.outputs.reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "JANUS paid checkout did **not** issue a payable invoice. Reason: \`$REASON\`. **Do not send funds.**"
      - name: Publish exact live invoice
        if: steps.invoice.outputs.live == 'true' && steps.invoice.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/invoice-comment.md"
          import json
          r=json.load(open('runtime/paid-invoice-record.json')); i=r['invoice']; q=i['quote']; amount=i['amount_usdt_micros']/1_000_000
          print('### JANUS.SEARCH live invoice\n')
          print(f"Invoice: `{i['invoice_id']}`")
          print(f"Queue: **L{i['queue_level']} · {i['queue_code']}** — frozen for this invoice")
          print(f"Amount: **{amount:.6f} USDT**")
          print('Network: **Ethereum mainnet (chain_id 1)**')
          print(f"USDT contract: `{q['token_contract']}`")
          print(f"Recipient: `{q['receiving_address']}`")
          print(f"Expires: `{q['expires_at']}` — the transfer must be mined no later than this time.")
          print('Required confirmations: **12**\n')
          print('A queue-capacity slot was reserved before this invoice was published. Capacity/per-buyer limits are invoice-admission gates, not reasons to reject a valid payment later.')
          print('After the transfer has enough confirmations, post a new comment containing:')
          print('```\n<!-- JANUS_PAYMENT_PROOF_JSON\n{"tx_hash":"0x...","log_index":0}\nJANUS_PAYMENT_PROOF_JSON -->\n```')
          print('Payment settlement creates a queue entry; it does **not** start execution immediately. Higher levels may overtake waiting requests only; the active request is never preempted.')
          print('Live queue status: ' + __import__('os').environ['PAID_QUEUE_STATUS_URL'])
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/invoice-comment.md"

  payment-proof:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.issue.title, '[JANUS PAID SEARCH]') &&
      github.event.comment.user.login == github.event.issue.user.login &&
      github.event.issue.user.login != github.repository_owner &&
      contains(github.event.comment.body, 'JANUS_PAYMENT_PROOF_JSON')
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mount persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-paid-state"
          rm -rf "$state"
          git worktree add -B janus-market-paid-state "$state" origin/janus/market-state
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"
      - name: Extract payment proof and bind exact invoice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')); body=str(event['comment'].get('body') or '')
          a='<!-- JANUS_PAYMENT_PROOF_JSON'; b='JANUS_PAYMENT_PROOF_JSON -->'; s=body.find(a); e=body.find(b)
          if s<0 or e<0 or e<=s: raise SystemExit('JANUS_PAYMENT_PROOF_JSON_MARKER_MISSING')
          proof=json.loads(body[s+len(a):e].strip())
          if set(proof)-{'tx_hash','log_index'}: raise SystemExit('PAYMENT_PROOF_UNKNOWN_FIELDS')
          if not proof.get('tx_hash'): raise SystemExit('PAYMENT_PROOF_TX_HASH_REQUIRED')
          if proof.get('log_index') is not None: proof['log_index']=int(proof['log_index'])
          issue=event['issue']; state=Path(os.environ['MARKET_STATE']); invoice_path=state/'state/commerce/invoices'/f"issue-{issue['id']}.json"
          if not invoice_path.exists(): raise SystemExit('PAID_SEARCH_INVOICE_NOT_FOUND')
          record=json.loads(invoice_path.read_text())
          if record.get('buyer_login')!=issue['user']['login']: raise SystemExit('PAID_SEARCH_INVOICE_BUYER_MISMATCH')
          Path('runtime/paid-invoice-record.json').write_text(json.dumps(record,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          Path('runtime/payment-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Observe exact transaction, settle purchase, enqueue without starting execution
        id: settle
        env:
          PYTHONPATH: .
          ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
        shell: bash
        run: |
          set -euo pipefail
          python runtime/paid_search_settlement.py --invoice-record runtime/paid-invoice-record.json --proof runtime/payment-proof.json --state-root "$MARKET_STATE" --rpc-url "$ETHEREUM_RPC_URL" --readiness COMMERCE_READINESS.json --witness FOREIGN_AGENT_WITNESS.json --product products/JANUS.SEARCH.json --queue-policy PAID_QUEUE_POLICY.json --result-out runtime/paid-settlement-result.json --packet-out runtime/paid-home-packet.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('runtime/paid-settlement-result.json')); o=r.get('observation') or {}; f=(r.get('queue_snapshot') or {}).get('focus') or {}
          wait=f.get('estimated_wait_minutes') or {}
          print('status='+str(o.get('status') or 'ERROR')); print('confirmations='+str(o.get('confirmations') or 0)); print('settled='+('true' if r.get('settled') is True else 'false')); print('purchase_id='+str(r.get('purchase_id') or '')); print('query_id='+str(r.get('query_id') or '')); print('queue_level='+str(r.get('queue_level') or '')); print('queue_state='+str(f.get('state') or '')); print('position='+str(f.get('position') if f.get('position') is not None else '')); print('ahead='+str(f.get('people_ahead_before_start') or 0)); print('wait_min='+str(wait.get('min') or 0)); print('wait_nominal='+str(wait.get('nominal') or 0)); print('wait_max='+str(wait.get('max') or 0))
          PY
      - name: Explain payment not yet admitted
        if: steps.settle.outputs.settled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Payment proof observed with status **${{ steps.settle.outputs.status }}** and **${{ steps.settle.outputs.confirmations }}/12 confirmations**. No purchase, queue entry or execution was admitted."
      - name: Commit settled purchase and queue entry atomically
        if: steps.settle.outputs.settled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$MARKET_STATE" config user.name "JANUS Paid Search State"
          git -C "$MARKET_STATE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$MARKET_STATE" add state/commerce
          if git -C "$MARKET_STATE" diff --cached --quiet; then
            echo 'PAID_PURCHASE_QUEUE_LEDGER=IDEMPOTENT_REPLAY'
          else
            git -C "$MARKET_STATE" commit -m "Paid SEARCH queued ${{ steps.settle.outputs.purchase_id }}"
            git -C "$MARKET_STATE" push origin HEAD:refs/heads/janus/market-state
            echo 'PAID_PURCHASE_QUEUE_LEDGER=PASS'
          fi
      - name: Confirm purchase accepted into serialized queue
        if: steps.settle.outputs.settled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Payment is **CONFIRMED** and purchase \`${{ steps.settle.outputs.purchase_id }}\` is sealed in paid queue **L${{ steps.settle.outputs.queue_level }}**. Current state: **${{ steps.settle.outputs.queue_state }}**; queue position: **${{ steps.settle.outputs.position }}**; requests ahead before start: **${{ steps.settle.outputs.ahead }}**; estimated wait: **${{ steps.settle.outputs.wait_min }}–${{ steps.settle.outputs.wait_max }} min** (nominal ~${{ steps.settle.outputs.wait_nominal }} min). This ETA is an estimate, not a guarantee. The queue runs one paid SEARCH at a time; higher tiers can overtake waiting requests but cannot interrupt the active request. Settlement is **not execution start**. Exact retry creates neither a second queue entry nor a second charge. Live queue status: $PAID_QUEUE_STATUS_URL"
