name: JANUS Machine Market Repository Audit Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/r2_repo_audit_reconcile.py'
      - 'tests/test_r2_repo_audit_reconcile.py'
      - 'schemas/repo-audit-request.schema.json'
      - 'schemas/market-home-repo-audit-packet.schema.json'
      - 'schemas/home-repo-audit-response.schema.json'
      - 'schemas/repo-audit-delivery-receipt.schema.json'
      - 'schemas/repo-audit-response-quarantine.schema.json'
      - '.github/workflows/r2-repo-audit-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/r2_repo_audit_reconcile.py'
      - 'tests/test_r2_repo_audit_reconcile.py'
      - 'schemas/repo-audit-request.schema.json'
      - 'schemas/market-home-repo-audit-packet.schema.json'
      - 'schemas/home-repo-audit-response.schema.json'
      - 'schemas/repo-audit-delivery-receipt.schema.json'
      - 'schemas/repo-audit-response-quarantine.schema.json'
      - '.github/workflows/r2-repo-audit-reconcile.yml'
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test independent HOME response verification
        env:
          PYTHONPATH: .
        run: |
          python -m json.tool schemas/repo-audit-request.schema.json >/dev/null
          python -m json.tool schemas/market-home-repo-audit-packet.schema.json >/dev/null
          python -m json.tool schemas/home-repo-audit-response.schema.json >/dev/null
          python -m json.tool schemas/repo-audit-delivery-receipt.schema.json >/dev/null
          python -m json.tool schemas/repo-audit-response-quarantine.schema.json >/dev/null
          python -m py_compile runtime/r2_repo_audit_reconcile.py tests/test_r2_repo_audit_reconcile.py
          python -m unittest -v tests.test_r2_repo_audit_reconcile

  reconcile:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical Market
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Credentialless pull HOME service response mailbox
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/janus-home-service-responses"
          rm -rf "$home"
          if git -c http.extraHeader= ls-remote --exit-code --heads https://github.com/Hawkar-usls/Hawkar-usls.git janus/market-service-responses >/dev/null 2>&1; then
            git -c http.extraHeader= clone --quiet --depth 1 --branch janus/market-service-responses \
              https://github.com/Hawkar-usls/Hawkar-usls.git "$home"
            echo 'REPO_AUDIT_HOME_RESPONSE_CREDENTIALLESS_CLONE=PASS'
          else
            mkdir -p "$home/.janus/market-service-responses"
            git -C "$home" init -q
            echo 'REPO_AUDIT_HOME_RESPONSE_BRANCH_ABSENT=TRUE'
          fi
          echo "HOME_SERVICE_WT=$home" >> "$GITHUB_ENV"
          echo 'CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: Mount Market outbox and persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-home-outbox:refs/remotes/origin/janus/market-home-outbox
          outbox="$RUNNER_TEMP/market-service-outbox-reconcile"
          rm -rf "$outbox"
          git worktree add --detach "$outbox" origin/janus/market-home-outbox
          echo "MARKET_OUTBOX_WT=$outbox" >> "$GITHUB_ENV"
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-service-state-reconcile"
          rm -rf "$state"
          git worktree add -B janus-market-service-state "$state" origin/janus/market-state
          echo "MARKET_STATE_WT=$state" >> "$GITHUB_ENV"

      - name: Verify, quarantine, then select repository-audit response
        id: select
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/repo-audit-reconcile
          home_commit="$(git -C "$HOME_SERVICE_WT" rev-parse --verify HEAD 2>/dev/null || true)"
          HOME_SOURCE_COMMIT="$home_commit" python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from runtime.r2_repo_audit_reconcile import select_oldest_verified_response

          state_root=Path(os.environ['MARKET_STATE_WT'])/'state/r2-services/repo-audit'
          result=select_oldest_verified_response(
              home_response_dir=Path(os.environ['HOME_SERVICE_WT'])/'.janus/market-service-responses',
              outbox_dir=Path(os.environ['MARKET_OUTBOX_WT'])/'.janus/market-home-outbox',
              receipts_dir=state_root/'receipts',
              quarantine_dir=state_root/'quarantine',
              stage_dir=Path('runtime/repo-audit-reconcile'),
              home_source_commit=os.environ['HOME_SOURCE_COMMIT'],
          )
          for key, value in result.items():
              if isinstance(value, bool):
                  value=str(value).lower()
              print(f'{key}={value}')
          PY

      - name: No unreconciled repository-audit result
        if: steps.select.outputs.found != 'true' && steps.select.outputs.state_changed != 'true'
        run: echo 'REPO_AUDIT_NO_UNRECONCILED_HOME_RESULT=TRUE'

      - name: Record rejected HOME responses as quarantined
        if: steps.select.outputs.state_changed == 'true'
        env:
          QUARANTINED_COUNT: ${{ steps.select.outputs.quarantined_count }}
        run: echo "REPO_AUDIT_HOME_RESPONSES_QUARANTINED=$QUARANTINED_COUNT"

      - name: Verify exact packet and persist delivery
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          REQUEST_ID: ${{ steps.select.outputs.request_id }}
          HOME_RESPONSE_PATH: ${{ steps.select.outputs.home_response_path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from runtime.r2_repo_audit_reconcile import (
              build_market_receipt,
              build_result_comment,
              create_only_json,
              expected_home_response_path,
              require_request_id,
              verify_home_response,
          )

          rid=require_request_id(os.environ['REQUEST_ID'])
          response_path=os.environ['HOME_RESPONSE_PATH']
          if response_path != expected_home_response_path(rid):
              raise SystemExit('REPO_AUDIT_HOME_RESPONSE_PATH_INVALID')
          packet=json.load(open('runtime/repo-audit-reconcile/packet.json'))
          response=json.load(open('runtime/repo-audit-reconcile/home-response.json'))
          if packet['service_request']['request_id'] != rid:
              raise SystemExit('REPO_AUDIT_SELECTION_PACKET_ID_MISMATCH')
          if response['service_request_id'] != rid:
              raise SystemExit('REPO_AUDIT_SELECTION_RESPONSE_ID_MISMATCH')
          if not verify_home_response(response, packet=packet):
              raise SystemExit('REPO_AUDIT_HOME_RESPONSE_INVALID')

          home=Path(os.environ['HOME_SERVICE_WT'])
          source_commit=subprocess.check_output(['git','-C',str(home),'rev-parse','HEAD'],text=True).strip()
          blob=subprocess.check_output(
              ['git','-C',str(home),'hash-object',response_path], text=True
          ).strip()
          receipt=build_market_receipt(
              response,
              packet=packet,
              home_source_commit=source_commit,
              home_response_path=response_path,
              home_response_blob_sha=blob,
          )
          comment=build_result_comment(response,packet=packet)
          Path('runtime/repo-audit-reconcile/receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('runtime/repo-audit-reconcile/result-comment.md').write_text(comment,encoding='utf-8')
          state=Path(os.environ['MARKET_STATE_WT'])/'state/r2-services/repo-audit'
          create_only_json(state/'receipts'/f'{rid}.json',receipt)
          create_only_json(state/'responses'/f'{rid}.json',response)
          PY
          echo 'REPO_AUDIT_VERIFIED_BUYER_DELIVERY=PASS'
          echo 'REPO_AUDIT_SERVICE_DEBT_CLOSED=PASS'

      - name: Commit create-only Market delivery state
        if: steps.select.outputs.found == 'true' || steps.select.outputs.state_changed == 'true'
        env:
          REQUEST_ID: ${{ steps.select.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$MARKET_STATE_WT"
          git config user.name "JANUS Market Service Reconciler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/r2-services/repo-audit
          if git diff --cached --quiet; then
            echo 'REPO_AUDIT_MARKET_STATE_COMMIT=NO_CHANGE_EXACT_RETRY'
          else
            subject="${REQUEST_ID:-quarantine-only}"
            git commit -m "Reconcile repo audit $subject"
            git push origin HEAD:refs/heads/janus/market-state
            echo 'REPO_AUDIT_MARKET_STATE_COMMIT=PASS'
          fi

      - name: Fresh-checkout verify durable delivery
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          REQUEST_ID: ${{ steps.select.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          replay="$RUNNER_TEMP/market-service-state-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/market-state
          REPLAY="$replay" python - <<'PY'
          import json, os
          from pathlib import Path
          from runtime.r2_repo_audit_reconcile import (
              require_request_id,
              verify_home_response,
              verify_market_receipt,
          )

          rid=require_request_id(os.environ['REQUEST_ID'])
          root=Path(os.environ['REPLAY'])/'state/r2-services/repo-audit'
          receipt=json.loads((root/'receipts'/f'{rid}.json').read_text())
          response=json.loads((root/'responses'/f'{rid}.json').read_text())
          packet=json.load(open('runtime/repo-audit-reconcile/packet.json'))
          if packet['service_request']['request_id'] != rid:
              raise SystemExit('REPO_AUDIT_REPLAY_PACKET_ID_MISMATCH')
          if not verify_home_response(response,packet=packet):
              raise SystemExit('REPO_AUDIT_REPLAY_RESPONSE_INVALID')
          if not verify_market_receipt(receipt,response=response,packet=packet):
              raise SystemExit('REPO_AUDIT_REPLAY_RECEIPT_INVALID')
          print('REPO_AUDIT_FRESH_CHECKOUT_DELIVERY=PASS')
          PY

      - name: Return repository audit to source issue
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
          REQUEST_ID: ${{ steps.select.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(python - <<'PY'
          import json, os
          from runtime.r2_repo_audit_reconcile import require_request_id, verify_packet

          rid=require_request_id(os.environ['REQUEST_ID'])
          packet=json.load(open('runtime/repo-audit-reconcile/packet.json'))
          if not verify_packet(packet) or packet['service_request']['request_id'] != rid:
              raise SystemExit('REPO_AUDIT_RESULT_RETURN_PACKET_INVALID')
          issue=packet['return_route']['source_issue_number']
          if not isinstance(issue,int) or isinstance(issue,bool) or issue <= 0:
              raise SystemExit('REPO_AUDIT_SOURCE_ISSUE_INVALID')
          print(issue)
          PY
          )"
          marker="REPO_AUDIT_RETURNED:$REQUEST_ID"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --paginate --jq '.[].body' || true)"
          if printf '%s' "$existing" | grep -Fq "$marker"; then
            echo 'REPO_AUDIT_RESULT_COMMENT_ALREADY_PRESENT=TRUE'
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
              -f body="$(cat runtime/repo-audit-reconcile/result-comment.md)" >/dev/null
            echo 'REPO_AUDIT_RESULT_RETURNED=PASS'
          fi

      - name: Upload Market repository-audit reconciliation witness
        if: steps.select.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: janus-repo-audit-market-${{ steps.select.outputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/repo-audit-reconcile/
          if-no-files-found: error
