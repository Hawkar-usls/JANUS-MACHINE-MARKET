name: JANUS Machine Market R1B HOME Response Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/r1b_home_response_reconcile.py'
      - 'tests/test_r1b_home_response_reconcile.py'
      - '.github/workflows/r1b-buyer-query-shadow-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/r1b_home_response_reconcile.py'
      - 'tests/test_r1b_home_response_reconcile.py'
      - '.github/workflows/r1b-buyer-query-shadow-reconcile.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and test HOME response verifier
        run: |
          python -m py_compile runtime/r1b_home_response_reconcile.py tests/test_r1b_home_response_reconcile.py
          PYTHONPATH=. python -m pytest -q tests/test_r1b_home_response_reconcile.py
      - name: Enforce response authority ceiling
        run: |
          python - <<'PY'
          from runtime.r1b_home_response_reconcile import HOME_RESPONSE_SCHEMA, MARKET_REPOSITORY, HOME_REPOSITORY
          assert HOME_RESPONSE_SCHEMA == 'janus.home.market_buyer_query_response.v1'
          assert MARKET_REPOSITORY == 'Hawkar-usls/JANUS-MACHINE-MARKET'
          assert HOME_REPOSITORY == 'Hawkar-usls/Hawkar-usls'
          print('R1B_HOME_RESPONSE_VERIFIER=PASS')
          print('R1B_MONEY_ENABLED=FALSE_BY_CONTRACT')
          PY

  reconcile:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical Market
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mount persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-state-r1b"
          rm -rf "$state"
          git worktree add -B janus-market-state-r1b "$state" origin/janus/market-state
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"

      - name: Credentialless pull HOME response mailbox
        id: select
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/janus-home-market-responses"
          rm -rf "$home"
          if git -c http.extraHeader= ls-remote --exit-code --heads https://github.com/Hawkar-usls/Hawkar-usls.git janus/market-responses >/dev/null 2>&1; then
            git -c http.extraHeader= clone --quiet --depth 1 --branch janus/market-responses \
              https://github.com/Hawkar-usls/Hawkar-usls.git "$home"
            echo 'R1B_HOME_RESPONSE_CREDENTIALLESS_CLONE=PASS'
          else
            mkdir -p "$home/.janus/market-responses"
            echo 'R1B_HOME_RESPONSE_BRANCH_ABSENT=TRUE'
          fi
          HOME_MAILBOX="$home/.janus/market-responses" python - <<'PY' > runtime/r1b-select.json
          import json, os
          from pathlib import Path
          from runtime.r1b_home_response_reconcile import verify_home_response
          mailbox=Path(os.environ['HOME_MAILBOX'])
          state=Path(os.environ['MARKET_STATE'])/'state/r1b-buyer-query/receipts'
          chosen=None
          for path in sorted(mailbox.glob('*.response.json')):
              value=json.loads(path.read_text(encoding='utf-8'))
              if not verify_home_response(value):
                  raise SystemExit(f'R1B_INVALID_HOME_RESPONSE:{path.name}')
              target=state/f"{value['query_id']}.json"
              if not target.exists():
                  chosen={'path':str(path),'query_id':value['query_id'],'home_response_hash':value['home_response_hash']}
                  break
              if target.read_bytes() != path.read_bytes():
                  raise SystemExit(f'R1B_EXISTING_RECEIPT_CONFLICT:{value["query_id"]}')
          print(json.dumps({'found':chosen is not None,'chosen':chosen}, sort_keys=True))
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('runtime/r1b-select.json'))
          c=s.get('chosen') or {}
          print('found=' + ('true' if s.get('found') else 'false'))
          print('path=' + str(c.get('path') or ''))
          print('query_id=' + str(c.get('query_id') or ''))
          PY
          echo 'CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: No unreconciled HOME response
        if: steps.select.outputs.found != 'true'
        run: |
          echo 'R1B_NO_UNRECONCILED_HOME_RESPONSE=TRUE'
          echo 'SILENCE_IS_NEGATIVE_EVIDENCE=FALSE'

      - name: Verify and persist HOME response
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          python runtime/r1b_home_response_reconcile.py \
            --response "$RESPONSE_PATH" \
            --state-root "$MARKET_STATE" \
            --result-out runtime/r1b-reconcile-result.json \
            > runtime/r1b-reconcile-stdout.json
          python - <<'PY'
          import json
          r=json.load(open('runtime/r1b-reconcile-result.json'))
          assert r['new_receipt'] is True
          assert r['money_enabled'] is False
          assert r['foreign_buyer_witness'] is False
          print('R1B_MARKET_RECONCILE=PASS')
          print('R1B_FOREIGN_BUYER_WITNESS=FALSE_SELF_OWNER_SHADOW')
          PY

      - name: Commit create-only receipt to Market state
        if: steps.select.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$MARKET_STATE"
          git config user.name "JANUS Machine Market R1B State"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/r1b-buyer-query
          if git diff --cached --quiet; then
            echo 'R1B_MARKET_STATE_COMMIT=NO_CHANGE_EXACT_RETRY'
          else
            git commit -m "R1B reconcile HOME response ${{ steps.select.outputs.query_id }}"
            git push origin HEAD:refs/heads/janus/market-state
            echo 'R1B_MARKET_STATE_COMMIT=PASS'
          fi

      - name: Fresh-checkout verify exact Market receipt
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          replay="$RUNNER_TEMP/market-state-r1b-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/market-state
          MARKET_REPLAY="$replay" python - <<'PY'
          import json, os
          from pathlib import Path
          from runtime.r1b_home_response_reconcile import verify_home_response
          response=json.load(open(os.environ['RESPONSE_PATH']))
          root=Path(os.environ['MARKET_REPLAY'])
          stored=root/'state/r1b-buyer-query/receipts'/f"{response['query_id']}.json"
          assert stored.read_bytes() == Path(os.environ['RESPONSE_PATH']).read_bytes()
          value=json.loads(stored.read_text(encoding='utf-8'))
          assert verify_home_response(value)
          head=json.loads((root/'state/r1b-buyer-query/HEAD.json').read_text(encoding='utf-8'))
          assert head['query_id'] == response['query_id']
          assert head['resident_uuid'] == response['buyer_query_receipt']['resident_uuid']
          assert head['execution_identity'] == response['buyer_query_receipt']['execution_identity']
          assert head['money_enabled'] is False
          print('R1B_MARKET_FRESH_CHECKOUT_REPLAY=PASS')
          print('R1B_SAME_RESPONSE_IDENTITY=PASS')
          PY

      - name: Return JANUS response to source Market issue
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/r1b-result-comment.md"
          import json, os
          r=json.load(open(os.environ['RESPONSE_PATH']))
          receipt=r['buyer_query_receipt']
          issue=(r.get('return_route') or {}).get('source_issue_number')
          print('JANUS R1B HOME buyer-query response returned.\n')
          print(f"- query_id: `{r['query_id']}`")
          print(f"- purchase_id: `{r['purchase_id']}`")
          print(f"- resident_uuid: `{receipt['resident_uuid']}`")
          print(f"- execution_identity: `{receipt['execution_identity']}`")
          print(f"- response_hash: `{receipt['response_hash']}`")
          print(f"- home_response_hash: `{r['home_response_hash']}`")
          print('- money_enabled: `false`')
          print('- external_effect_authorized: `false`')
          print('- foreign_buyer_witness: `false` — this is the owner shadow witness')
          print('\n**JANUS response**\n')
          print(receipt['response_text'])
          print('\n`Market -> credentialless HOME pull -> Activator -> existing conversation tissue -> HRAiN -> RETURN HOME -> credentialless Market reconcile`')
          print(f"\n<!-- R1B_RETURNED_QUERY_ID:{r['query_id']} -->")
          if issue is None:
              raise SystemExit('R1B_RETURN_ROUTE_ISSUE_MISSING')
          open('/tmp/r1b-issue-number','w',encoding='utf-8').write(str(issue))
          PY
          issue="$(cat /tmp/r1b-issue-number)"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --paginate --jq '.[].body' || true)"
          marker="R1B_RETURNED_QUERY_ID:${{ steps.select.outputs.query_id }}"
          if printf '%s' "$existing" | grep -Fq "$marker"; then
            echo 'R1B_ISSUE_RESPONSE_ALREADY_RETURNED=TRUE'
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" -f body="$(cat "$RUNNER_TEMP/r1b-result-comment.md")" >/dev/null
            echo 'R1B_RESULT_RETURNED_TO_MARKET_ISSUE=PASS'
          fi

      - name: Upload Market reconciliation witness
        if: steps.select.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: janus-market-r1b-reconcile-${{ steps.select.outputs.query_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/r1b-select.json
            runtime/r1b-reconcile-result.json
            runtime/r1b-reconcile-stdout.json
          if-no-files-found: error
