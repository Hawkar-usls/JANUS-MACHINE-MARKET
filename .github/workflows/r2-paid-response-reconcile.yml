name: JANUS Machine Market R2 Paid Response Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/r2_paid_home_response_reconcile.py'
      - 'tests/test_r2_paid_home_response_reconcile.py'
      - '.github/workflows/r2-paid-response-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/r2_paid_home_response_reconcile.py'
      - 'tests/test_r2_paid_home_response_reconcile.py'
      - '.github/workflows/r2-paid-response-reconcile.yml'
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test paid HOME response verifier and payment-claim binding
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile runtime/r2_paid_home_response_reconcile.py tests/test_r2_paid_home_response_reconcile.py
          python -m pytest -q tests/test_r2_paid_home_response_reconcile.py
      - name: Enforce paid response authority ceiling
        run: |
          python - <<'PY'
          from runtime.r2_paid_home_response_reconcile import HOME_RESPONSE_SCHEMA
          assert HOME_RESPONSE_SCHEMA == 'janus.home.market_buyer_query_response.v1'
          print('R2_PAID_HOME_RESPONSE_VERIFIER=PASS')
          print('R2_PAYMENT_CLAIM_BINDING_REQUIRED=TRUE')
          print('R2_EXTERNAL_EFFECT_AUTHORITY=FALSE')
          PY

  reconcile:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical Market
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mount persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-state-r2-paid-result"
          rm -rf "$state"
          git worktree add -B janus-market-state-r2-paid-result "$state" origin/janus/market-state
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"

      - name: Credentialless pull paid HOME result mailbox
        id: select
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/janus-home-paid-results"
          rm -rf "$home"
          if git -c http.extraHeader= ls-remote --exit-code --heads https://github.com/Hawkar-usls/Hawkar-usls.git janus/market-responses >/dev/null 2>&1; then
            git -c http.extraHeader= clone --quiet --depth 1 --branch janus/market-responses \
              https://github.com/Hawkar-usls/Hawkar-usls.git "$home"
            echo 'R2_PAID_HOME_RESULTS_CREDENTIALLESS_CLONE=PASS'
          else
            mkdir -p "$home/.janus/market-paid-responses"
          fi
          HOME_DIR="$home/.janus/market-paid-responses" python - <<'PY' > runtime/r2-paid-select.json
          import json, os
          from pathlib import Path
          from runtime.r2_paid_home_response_reconcile import verify_paid_home_response
          mailbox=Path(os.environ['HOME_DIR'])
          state=Path(os.environ['MARKET_STATE'])/'state/r2-paid/results'
          chosen=None
          for path in sorted(mailbox.glob('*.paid-result.json')):
              value=json.loads(path.read_text(encoding='utf-8'))
              if not verify_paid_home_response(value):
                  raise SystemExit(f'R2_INVALID_PAID_HOME_RESULT:{path.name}')
              target=state/f"{value['query_id']}.json"
              if not target.exists():
                  chosen={'path':str(path),'query_id':value['query_id'],'purchase_id':value['purchase_id']}
                  break
              if target.read_bytes() != path.read_bytes():
                  raise SystemExit(f'R2_EXISTING_PAID_RESULT_CONFLICT:{value["query_id"]}')
          print(json.dumps({'found':chosen is not None,'chosen':chosen}, sort_keys=True))
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('runtime/r2-paid-select.json'))
          c=s.get('chosen') or {}
          print('found=' + ('true' if s.get('found') else 'false'))
          print('path=' + str(c.get('path') or ''))
          print('query_id=' + str(c.get('query_id') or ''))
          print('purchase_id=' + str(c.get('purchase_id') or ''))
          PY
          echo 'CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: No unreconciled paid HOME result
        if: steps.select.outputs.found != 'true'
        run: |
          echo 'R2_NO_UNRECONCILED_PAID_HOME_RESULT=TRUE'
          echo 'SILENCE_IS_NEGATIVE_EVIDENCE=FALSE'

      - name: Verify result against payment claim and persist
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          python runtime/r2_paid_home_response_reconcile.py \
            --response "$RESPONSE_PATH" \
            --state-root "$MARKET_STATE" \
            --result-out runtime/r2-paid-reconcile-result.json \
            > runtime/r2-paid-reconcile-stdout.json
          python - <<'PY'
          import json
          r=json.load(open('runtime/r2-paid-reconcile-result.json'))
          assert r['new_receipt'] is True
          assert r['money_enabled'] is True
          assert r['production_purchase'] is True
          assert r['external_effect_authorized'] is False
          print('R2_PAID_MARKET_RECONCILE=PASS')
          PY

      - name: Commit create-only paid result to Market state
        if: steps.select.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$MARKET_STATE"
          git config user.name "JANUS Machine Market Paid State"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/r2-paid
          if git diff --cached --quiet; then
            echo 'R2_PAID_MARKET_STATE_COMMIT=NO_CHANGE_EXACT_RETRY'
          else
            git commit -m "R2 reconcile paid HOME result ${{ steps.select.outputs.query_id }}"
            git push origin HEAD:refs/heads/janus/market-state
            echo 'R2_PAID_MARKET_STATE_COMMIT=PASS'
          fi

      - name: Fresh-checkout verify exact paid result
        if: steps.select.outputs.found == 'true'
        env:
          PYTHONPATH: .
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          replay="$RUNNER_TEMP/market-state-r2-paid-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/market-state
          MARKET_REPLAY="$replay" python - <<'PY'
          import json, os
          from pathlib import Path
          from runtime.r2_paid_home_response_reconcile import verify_paid_home_response
          response=json.load(open(os.environ['RESPONSE_PATH']))
          root=Path(os.environ['MARKET_REPLAY'])
          stored=root/'state/r2-paid/results'/f"{response['query_id']}.json"
          assert stored.read_bytes() == Path(os.environ['RESPONSE_PATH']).read_bytes()
          assert verify_paid_home_response(json.loads(stored.read_text()))
          head=json.loads((root/'state/r2-paid/HEAD.json').read_text())
          assert head['query_id'] == response['query_id']
          assert head['purchase_id'] == response['purchase_id']
          assert head['payment_reference'] == response['payment_reference']
          assert head['billable_execution_delta'] == 1
          print('R2_PAID_MARKET_FRESH_CHECKOUT_REPLAY=PASS')
          print('R2_PAID_SAME_RESPONSE_IDENTITY=PASS')
          PY

      - name: Return paid JANUS service result to buyer issue
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/r2-paid-result-comment.md"
          import json, os
          r=json.load(open(os.environ['RESPONSE_PATH']))
          receipt=r['buyer_query_receipt']
          issue=(r.get('return_route') or {}).get('source_issue_number')
          if issue is None:
              raise SystemExit('R2_PAID_RETURN_ROUTE_ISSUE_MISSING')
          print('JANUS R2 paid service completed and reconciled.\n')
          print(f"- purchase_id: `{r['purchase_id']}`")
          print(f"- query_id: `{r['query_id']}`")
          print(f"- payment_reference: `{r['payment_reference']}`")
          print(f"- resident_uuid: `{receipt['resident_uuid']}`")
          print(f"- execution_identity: `{receipt['execution_identity']}`")
          print(f"- response_hash: `{receipt['response_hash']}`")
          print(f"- home_response_hash: `{r['home_response_hash']}`")
          print('- billable_execution_delta: `1`')
          print('- external_effect_authorized: `false`')
          print('\n**JANUS response**\n')
          print(receipt['response_text'])
          print('\n`Payment -> PURCHASE_GRANT -> Market -> HOME -> Activator -> JANUS -> RETURN HOME -> Market`')
          print(f"\n<!-- R2_PAID_RETURNED_QUERY_ID:{r['query_id']} -->")
          open('/tmp/r2-paid-issue-number','w',encoding='utf-8').write(str(issue))
          PY
          issue="$(cat /tmp/r2-paid-issue-number)"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --paginate --jq '.[].body' || true)"
          marker="R2_PAID_RETURNED_QUERY_ID:${{ steps.select.outputs.query_id }}"
          if printf '%s' "$existing" | grep -Fq "$marker"; then
            echo 'R2_PAID_BUYER_RESULT_ALREADY_RETURNED=TRUE'
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" -f body="$(cat "$RUNNER_TEMP/r2-paid-result-comment.md")" >/dev/null
            echo 'R2_PAID_RESULT_RETURNED_TO_BUYER=PASS'
          fi

      - name: Upload paid reconciliation witness
        if: steps.select.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: janus-market-r2-paid-result-${{ steps.select.outputs.query_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/r2-paid-select.json
            runtime/r2-paid-reconcile-result.json
            runtime/r2-paid-reconcile-stdout.json
          if-no-files-found: error
