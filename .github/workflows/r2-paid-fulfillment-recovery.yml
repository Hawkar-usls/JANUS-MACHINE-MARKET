name: JANUS Machine Market R2 Fulfillment Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'BUYER_ACCOUNT_POLICY.json'
      - 'ACCOUNT_PLANE.json'
      - 'FULFILLMENT_WARRANTY.json'
      - 'JANUS_COIN_REWARD_POLICY.json'
      - 'runtime/buyer_accounts.py'
      - 'runtime/fulfillment_debt.py'
      - 'runtime/r2_paid_accounting.py'
      - 'runtime/r2_paid_recovery.py'
      - 'tests/test_r2_paid_accounting.py'
      - 'tests/test_r2_paid_recovery.py'
      - '.github/workflows/r2-paid-fulfillment-recovery.yml'
  workflow_run:
    workflows:
      - 'JANUS Machine Market R2 Paid Buyer Query'
      - 'JANUS Machine Market R2 Paid Response Reconcile'
    types: [completed]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile paid recovery tissue
        run: |
          python -m py_compile \
            runtime/buyer_accounts.py \
            runtime/fulfillment_debt.py \
            runtime/r2_paid_accounting.py \
            runtime/r2_paid_recovery.py \
            tests/test_r2_paid_accounting.py \
            tests/test_r2_paid_recovery.py
      - name: Run crash/retry accounting tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v \
            tests.test_r2_paid_accounting \
            tests.test_r2_paid_recovery
      - name: Enforce warranty authority boundary
        run: |
          python - <<'PY'
          import json
          warranty=json.load(open('FULFILLMENT_WARRANTY.json'))
          reward=json.load(open('JANUS_COIN_REWARD_POLICY.json'))
          assert warranty['semantics']['timeout_closes_debt'] is False
          assert warranty['semantics']['workflow_failure_closes_debt'] is False
          assert warranty['semantics']['only_verified_buyer_delivery_closes_normal_service_debt'] is True
          assert warranty['semantics']['cognition_semantics'] == 'AT_MOST_ONE_COGNITION_PER_QUERY_ID'
          assert reward['production_purchase_reward']['mint_trigger'] == 'VERIFIED_BUYER_DELIVERY'
          assert reward['authority']['janus_coin_is_payment_proof'] is False
          print('R2_SERVICE_DEBT_WARRANTY=PASS')
          print('R2_WATCHDOG_SECOND_COGNITION_AUTHORITY=FALSE')
          print('R2_JANUS_COIN_MINT_BEFORE_DELIVERY=FALSE')
          PY

  recover:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-machine-market-state-writer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical Market
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mount persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/market-state-r2-recovery"
          rm -rf "$state"
          git worktree add -B janus-market-state-r2-recovery "$state" origin/janus/market-state
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"

      - name: Credentialless read paid outbox witnesses
        shell: bash
        run: |
          set -euo pipefail
          outbox="$RUNNER_TEMP/market-paid-outbox-recovery"
          rm -rf "$outbox"
          if git -c http.extraHeader= ls-remote --exit-code --heads https://github.com/Hawkar-usls/JANUS-MACHINE-MARKET.git janus/market-home-outbox >/dev/null 2>&1; then
            git -c http.extraHeader= clone --quiet --depth 1 --branch janus/market-home-outbox \
              https://github.com/Hawkar-usls/JANUS-MACHINE-MARKET.git "$outbox"
          else
            mkdir -p "$outbox/.janus/market-home-outbox"
          fi
          echo "PAID_OUTBOX_ROOT=$outbox" >> "$GITHUB_ENV"
          echo 'R2_RECOVERY_CROSS_REPO_WRITE_CREDENTIAL_USED=FALSE'

      - name: Reconstruct admitted buyer accounts and service debt from immutable witnesses
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/r2-recovery
          printf '{}\n' > runtime/r2-recovery/no-delivery-proofs.json
          python runtime/r2_paid_recovery.py \
            --state-root "$MARKET_STATE" \
            --outbox-root "$PAID_OUTBOX_ROOT" \
            --delivery-proofs runtime/r2-recovery/no-delivery-proofs.json \
            --reward-policy JANUS_COIN_REWARD_POLICY.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output runtime/r2-recovery/admission.json

      - name: Recover missing buyer delivery from already verified persistent result
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from runtime.r2_paid_home_response_reconcile import verify_paid_home_response

          state=Path(os.environ['MARKET_STATE'])
          repo=os.environ['GITHUB_REPOSITORY']
          results=state/'state/r2-paid/results'
          bindings=state/'state/r2-paid/account-bindings'
          delivered=0
          if results.exists():
              for path in sorted(results.glob('*.json')):
                  response=json.loads(path.read_text(encoding='utf-8'))
                  if not verify_paid_home_response(response):
                      raise SystemExit(f'R2_RECOVERY_PERSISTED_RESULT_INVALID:{path.name}')
                  qid=str(response['query_id']); purchase_id=str(response['purchase_id'])
                  bpath=bindings/f'{purchase_id}.json'
                  if not bpath.exists():
                      continue
                  binding=json.loads(bpath.read_text(encoding='utf-8'))
                  issue=binding.get('source_issue_number')
                  if not isinstance(issue,int):
                      continue
                  comments=json.loads(subprocess.check_output([
                      'gh','api',f'repos/{repo}/issues/{issue}/comments','--paginate'
                  ],text=True) or '[]')
                  marker=f'R2_PAID_RETURNED_QUERY_ID:{qid}'
                  if any(marker in str(c.get('body') or '') for c in comments):
                      continue
                  receipt=response['buyer_query_receipt']
                  body=(
                      'JANUS R2 paid service completed and recovered by the fulfillment warranty.\n\n'
                      f'- purchase_id: `{purchase_id}`\n'
                      f'- query_id: `{qid}`\n'
                      f'- payment_reference: `{response["payment_reference"]}`\n'
                      f'- resident_uuid: `{receipt["resident_uuid"]}`\n'
                      f'- execution_identity: `{receipt["execution_identity"]}`\n'
                      f'- response_hash: `{receipt["response_hash"]}`\n'
                      f'- home_response_hash: `{response["home_response_hash"]}`\n'
                      '- external_effect_authorized: `false`\n\n'
                      '**JANUS response**\n\n'
                      + str(receipt['response_text']) + '\n\n'
                      '`Recovered from the already verified persistent Market result; JANUS was not executed again.`\n\n'
                      f'<!-- {marker} -->'
                  )
                  subprocess.check_call([
                      'gh','api',f'repos/{repo}/issues/{issue}/comments','-f',f'body={body}'
                  ],stdout=subprocess.DEVNULL)
                  delivered += 1
          print(f'R2_RECOVERY_BUYER_COMMENTS_CREATED={delivered}')
          PY

      - name: Build cryptographic delivery proofs from actual buyer comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > runtime/r2-recovery/delivery-proofs.json
          import hashlib, json, os, subprocess
          from pathlib import Path

          def canonical(v):
              return json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          state=Path(os.environ['MARKET_STATE'])
          repo=os.environ['GITHUB_REPOSITORY']
          proofs={}
          results=state/'state/r2-paid/results'
          bindings=state/'state/r2-paid/account-bindings'
          if results.exists():
              for path in sorted(results.glob('*.json')):
                  response=json.loads(path.read_text(encoding='utf-8'))
                  qid=str(response.get('query_id') or '')
                  purchase_id=str(response.get('purchase_id') or '')
                  bpath=bindings/f'{purchase_id}.json'
                  if not bpath.exists():
                      continue
                  binding=json.loads(bpath.read_text(encoding='utf-8'))
                  issue=binding.get('source_issue_number')
                  if not isinstance(issue,int):
                      continue
                  comments=json.loads(subprocess.check_output([
                      'gh','api',f'repos/{repo}/issues/{issue}/comments','--paginate'
                  ],text=True) or '[]')
                  marker=f'R2_PAID_RETURNED_QUERY_ID:{qid}'
                  matches=[c for c in comments if marker in str(c.get('body') or '')]
                  if not matches:
                      continue
                  matches.sort(key=lambda c:int(c['id']))
                  c=matches[0]
                  proof_body={
                      'repository':repo,
                      'issue_number':issue,
                      'comment_id':int(c['id']),
                      'comment_body_sha256':hashlib.sha256(str(c.get('body') or '').encode()).hexdigest(),
                      'query_id':qid,
                      'purchase_id':purchase_id,
                      'marker':marker,
                  }
                  proofs[qid]={
                      'purchase_id':purchase_id,
                      'buyer_delivery_receipt_hash':hashlib.sha256(canonical(proof_body).encode()).hexdigest(),
                      'delivered_at':str(c.get('created_at') or c.get('updated_at') or ''),
                      'proof':proof_body,
                  }
          print(json.dumps(proofs,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Close only actually delivered service debt and mint bonus Janus Coins
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python runtime/r2_paid_recovery.py \
            --state-root "$MARKET_STATE" \
            --outbox-root "$PAID_OUTBOX_ROOT" \
            --delivery-proofs runtime/r2-recovery/delivery-proofs.json \
            --reward-policy JANUS_COIN_REWARD_POLICY.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output runtime/r2-recovery/final.json
          python - <<'PY'
          import json
          r=json.load(open('runtime/r2-recovery/final.json'))
          assert r['second_cognition_authorized'] is False
          assert r['payment_claim_mutated'] is False
          print('R2_RECOVERY_SECOND_COGNITION_AUTHORITY=FALSE')
          print('R2_RECOVERY_PAYMENT_CLAIM_MUTATION=FALSE')
          print('R2_OPEN_SERVICE_DEBT_COUNT=' + str(r['open_service_debt_count']))
          PY

      - name: Commit recovered accounts debt bindings and rewards to persistent Market state
        shell: bash
        run: |
          set -euo pipefail
          cd "$MARKET_STATE"
          git config user.name "JANUS Market Fulfillment Warranty"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/accounts state/r2-paid/account-bindings state/r2-paid/service-debts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'R2_FULFILLMENT_RECOVERY_STATE=NO_CHANGE'
          else
            git commit -m "R2 recover buyer accounts and fulfillment debt"
            git push origin HEAD:refs/heads/janus/market-state
            echo 'R2_FULFILLMENT_RECOVERY_STATE=PASS'
          fi

      - name: Fresh-checkout verify buyer account and service-debt state
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          replay="$RUNNER_TEMP/market-state-r2-recovery-replay"
          rm -rf "$replay"
          git worktree add --detach "$replay" origin/janus/market-state
          MARKET_REPLAY="$replay" python - <<'PY'
          import json, os
          from pathlib import Path
          from runtime.buyer_accounts import project
          from runtime.fulfillment_debt import verify
          root=Path(os.environ['MARKET_REPLAY'])
          for ledger in (root/'state/accounts').glob('*/ledger.jsonl') if (root/'state/accounts').exists() else []:
              events=[json.loads(x) for x in ledger.read_text().splitlines() if x.strip()]
              head=project(events)
              stored=json.loads((ledger.parent/'HEAD.json').read_text())
              assert head['head_hash'] == stored['head_hash']
          debt_dir=root/'state/r2-paid/service-debts'
          for path in debt_dir.glob('*.json') if debt_dir.exists() else []:
              assert verify(json.loads(path.read_text()))
          print('R2_FULFILLMENT_RECOVERY_FRESH_CHECKOUT=PASS')
          PY

      - name: Upload recovery witness
        uses: actions/upload-artifact@v4
        with:
          name: janus-market-r2-fulfillment-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/r2-recovery
          if-no-files-found: error
