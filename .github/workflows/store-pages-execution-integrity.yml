name: JANUS Market Pages Execution Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'PRICING.json'
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'products/**'
      - 'ORGAN_SERVICE_MATRIX.json'
      - 'CATALOG.json'
      - 'BTT_PAYMENT_ROUTE.json'
      - 'PUBLIC_SERVICE_BETA.json'
      - 'MACHINE_INGRESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'runtime/public_search_beta.py'
      - 'runtime/public_pr_review_beta.py'
      - 'runtime/paid_search_promotion.py'
      - 'assets/site.js'
      - 'assets/site.css'
      - 'assets/store-exec-v1.js'
      - 'assets/pricing-v1.js'
      - 'assets/pricing-v1.css'
      - 'tests/test_public_search_beta.py'
      - 'tests/test_public_pr_review_beta.py'
      - 'tests/test_store_pages_execution_contract.py'
      - 'tests/test_pricing_ui_contract.py'
      - 'tests/test_paid_search_promotion.py'
      - 'tests/test_btt_payment_route.py'
      - 'tests/test_organ_service_catalog.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/store-pages-execution-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'PRICING.json'
      - 'COMMERCE_READINESS.json'
      - 'FOREIGN_AGENT_WITNESS.json'
      - 'products/**'
      - 'ORGAN_SERVICE_MATRIX.json'
      - 'CATALOG.json'
      - 'BTT_PAYMENT_ROUTE.json'
      - 'PUBLIC_SERVICE_BETA.json'
      - 'MACHINE_INGRESS.json'
      - 'ORDER_EXECUTION_MATRIX.json'
      - 'runtime/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/store-pages-execution-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate storefront JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/store-exec-v1.js
          node --check assets/pricing-v1.js
          node --check assets/slot-polish-v5.js
      - name: Compile contract tests
        run: python -m py_compile tests/test_public_search_beta.py tests/test_public_pr_review_beta.py tests/test_store_pages_execution_contract.py tests/test_pricing_ui_contract.py tests/test_paid_search_promotion.py tests/test_btt_payment_route.py tests/test_organ_service_catalog.py runtime/paid_search_promotion.py
      - name: Verify public SEARCH beta admission and quotas
        run: PYTHONPATH=. python -m unittest -v tests.test_public_search_beta
      - name: Verify public PR REVIEW beta admission and quotas
        run: PYTHONPATH=. python -m unittest -v tests.test_public_pr_review_beta
      - name: Verify Pages -> Market -> HOME ingress contract
        run: python -m unittest -v tests.test_store_pages_execution_contract
      - name: Verify deterministic pricing and browser invoice boundary
        run: python -m unittest -v tests.test_pricing_ui_contract
      - name: Verify witness evidence promotion is commerce-independent
        run: PYTHONPATH=. python -m pytest -q tests/test_paid_search_promotion.py
      - name: Verify BTT discount route remains fail-closed until its rail is live
        run: python -m unittest -v tests.test_btt_payment_route
      - name: Verify specialist organ catalog remains receipt-gated
        run: python -m unittest -v tests.test_organ_service_catalog
      - name: Preserve canonical seller-live and evidence boundary
        run: |
          python - <<'PY'
          import json
          readiness=json.load(open('COMMERCE_READINESS.json',encoding='utf-8'))
          witness=json.load(open('FOREIGN_AGENT_WITNESS.json',encoding='utf-8'))
          product=json.load(open('products/JANUS.SEARCH.json',encoding='utf-8'))
          pricing=json.load(open('PRICING.json',encoding='utf-8'))
          beta=json.load(open('PUBLIC_SERVICE_BETA.json',encoding='utf-8'))
          ingress=json.load(open('MACHINE_INGRESS.json',encoding='utf-8'))
          js=open('assets/pricing-v1.js',encoding='utf-8').read()

          # First-free beta remains zero-price and non-commanding even though
          # a separate paid seller route is live.
          assert beta['authority']['money_enabled'] is False
          assert beta['authority']['command_authority_granted'] is False

          # Seller commerce is explicit and independent from witness evidence.
          assert readiness['seller_commerce_authorized'] is True
          assert readiness['money_enabled'] is True
          assert readiness['autonomous_purchase_declared'] is True
          assert product['machine_purchase'] is True
          assert product['live_gate']['checkout_live'] is True
          assert product['live_gate']['paid_queue_live'] is True
          assert product['live_gate']['foreign_agent_witness_is_seller_prerequisite'] is False
          assert pricing['status']=='MIXED_JANUS_SEARCH_LIVE_OTHER_SKUS_PREVIEW'
          assert pricing['live_skus']==['JANUS.SEARCH']
          paid=ingress['live_services']['JANUS.SEARCH']['paid_checkout']
          assert paid['status']=='LIVE_JANUS_SEARCH_ONLY'
          assert paid['primary_payment_state']=='LIVE_EXACT_INVOICE'
          assert paid['foreign_agent_witness_is_seller_prerequisite'] is False

          # The dynamic storefront must surface the canonical live state even
          # while the static fallback HTML may still contain conservative text.
          assert 'PAID SEARCH <b>LIVE · USDT</b>' in js
          assert 'BUY JANUS.SEARCH · LIVE CHECKOUT' in js
          assert 'LIVE · EXACT INVOICE' in js
          assert 'ON · JANUS.SEARCH ONLY' in js

          # Witness may be pending or confirmed, but never grants seller money.
          if witness['foreign_agent_witness'] is True:
              assert witness['promotion_authority']=='PERSISTENT_HOME_RECEIPT_VERIFIED'
              assert witness['witness_receipt_itself_enables_money'] is False
              assert witness['money_enabled'] is False
              print('FOREIGN_AGENT_WITNESS=CONFIRMED_EVIDENCE_ONLY')
          else:
              assert witness['status']=='PENDING_REAL_EXTERNAL_PERSISTENT_HOME_REQUEST'
              print('FOREIGN_AGENT_WITNESS=PENDING_REAL_EVIDENCE')

          assert 'OWNER_SHADOW' in ingress['live_services']['JANUS.REPO_AUDIT']['status']
          assert 'OWNER_SHADOW' in ingress['live_services']['JANUS.DATASET_SCOUT']['status']
          assert readiness['closed_skus']['JANUS.INFERENCE'].startswith('CLOSED_')
          assert readiness['closed_skus']['JANUS.COMPUTE'].startswith('CLOSED_')
          print('PAGES_PAID_SEARCH=LIVE_SELLER_AUTHORIZED')
          print('PAGES_TO_JANUS_PUBLIC_SEARCH_BETA=WIRED')
          print('PAYMENT_COMMAND_AUTHORITY=FALSE')
          PY
