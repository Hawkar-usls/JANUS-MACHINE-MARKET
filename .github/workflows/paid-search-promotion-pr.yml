name: JANUS Foreign Agent Witness Evidence Promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/paid_search_promotion.py'
      - 'runtime/persistent_home_foreign_witness.py'
      - 'tests/test_paid_search_promotion.py'
      - 'tests/test_persistent_home_foreign_witness.py'
      - '.github/workflows/paid-search-promotion-pr.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile witness promotion contracts
        run: python -m py_compile runtime/paid_search_promotion.py runtime/persistent_home_foreign_witness.py
      - name: Run witness promotion adversarial suites
        run: PYTHONPATH=. python -m pytest -q tests/test_paid_search_promotion.py tests/test_persistent_home_foreign_witness.py
      - name: Validate seller-live and independent witness lifecycle
        run: |
          python - <<'PY'
          import json
          w=json.load(open('FOREIGN_AGENT_WITNESS.json',encoding='utf-8'))
          r=json.load(open('COMMERCE_READINESS.json',encoding='utf-8'))
          p=json.load(open('products/JANUS.SEARCH.json',encoding='utf-8'))
          assert r['seller_commerce_authorized'] is True
          assert r['money_enabled'] is True and r['autonomous_purchase_declared'] is True
          assert p['machine_purchase'] is True and p['live_gate']['checkout_live'] is True
          assert p['live_gate']['foreign_agent_witness_is_seller_prerequisite'] is False
          if w.get('foreign_agent_witness') is True:
              assert w['promotion_authority']=='PERSISTENT_HOME_RECEIPT_VERIFIED'
              assert w['witness_receipt_itself_enables_money'] is False
              assert w['money_enabled'] is False
              print('WITNESS_EVIDENCE=CONFIRMED')
          else:
              assert w['status']=='PENDING_REAL_EXTERNAL_PERSISTENT_HOME_REQUEST'
              print('WITNESS_EVIDENCE=PENDING')
          assert r['closed_skus']['JANUS.INFERENCE'].startswith('CLOSED_')
          assert r['closed_skus']['JANUS.COMPUTE'].startswith('CLOSED_')
          print('SELLER_COMMERCE=LIVE_INDEPENDENT_OF_WITNESS')
          print('WITNESS_PROMOTION_ENABLES_MONEY=FALSE')
          PY

  prepare-witness-evidence-pr:
    if: github.event_name != 'pull_request'
    needs: contract
    concurrency:
      group: janus-foreign-witness-evidence-pr
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout canonical Market main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Mount persistent Market state and verify FIRST witness
        id: witness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin janus/market-state:refs/remotes/origin/janus/market-state
          state="$RUNNER_TEMP/foreign-witness-state"
          rm -rf "$state"
          git worktree add --detach "$state" origin/janus/market-state
          state_commit="$(git -C "$state" rev-parse HEAD)"
          echo "MARKET_STATE=$state" >> "$GITHUB_ENV"
          echo "market_state_commit=$state_commit" >> "$GITHUB_OUTPUT"
          first="$state/state/r1-foreign-home/FIRST.json"
          if [ ! -f "$first" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'FOREIGN_AGENT_WITNESS_FIRST=ABSENT'
            echo 'SILENCE_IS_NEGATIVE_EVIDENCE=FALSE'
            exit 0
          fi
          FIRST="$first" STATE="$state" PYTHONPATH=. python - <<'PY' > runtime/promotion-witness.json
          import json, os
          from pathlib import Path
          from runtime.paid_search_promotion import verify_first_witness
          first=json.load(open(os.environ['FIRST'],encoding='utf-8'))
          root=Path(os.environ['STATE'])/'state/r1-foreign-home'
          receipt=json.loads((root/'receipts'/f"{first['witness_id']}.json").read_text(encoding='utf-8'))
          verify_first_witness(first,receipt)
          print(json.dumps({'witness_id':first['witness_id'],'receipt_hash':first['receipt_hash']},sort_keys=True))
          PY
          wid="$(python -c "import json; print(json.load(open('runtime/promotion-witness.json'))['witness_id'])")"
          rh="$(python -c "import json; print(json.load(open('runtime/promotion-witness.json'))['receipt_hash'])")"
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "witness_id=$wid" >> "$GITHUB_OUTPUT"
          echo "receipt_hash=$rh" >> "$GITHUB_OUTPUT"
          echo 'FOREIGN_AGENT_WITNESS_FIRST=VERIFIED_PERSISTENT_STATE'

      - name: No qualifying witness yet
        if: steps.witness.outputs.found != 'true'
        run: |
          echo 'WITNESS_EVIDENCE_PR=NOT_CREATED'
          echo 'SELLER_COMMERCE_REMAINS_LIVE=TRUE'

      - name: Detect already-promoted canonical witness
        if: steps.witness.outputs.found == 'true'
        id: canonical
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          w=json.load(open('FOREIGN_AGENT_WITNESS.json',encoding='utf-8'))
          print('already_promoted=' + ('true' if w.get('foreign_agent_witness') is True else 'false'))
          PY

      - name: Generate evidence-only candidate
        if: steps.witness.outputs.found == 'true' && steps.canonical.outputs.already_promoted != 'true'
        env:
          PYTHONPATH: .
          MARKET_STATE_COMMIT: ${{ steps.witness.outputs.market_state_commit }}
        run: |
          python - <<'PY' > runtime/promotion-result.json
          import json, os
          from runtime.paid_search_promotion import write_live_promotion
          result=write_live_promotion(root='.',state_root=os.environ['MARKET_STATE'],market_state_commit=os.environ['MARKET_STATE_COMMIT'])
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
          cat runtime/promotion-result.json

      - name: Verify exact evidence-only file allowlist
        if: steps.witness.outputs.found == 'true' && steps.canonical.outputs.already_promoted != 'true'
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'FOREIGN_AGENT_WITNESS.json',
            'COMMERCE_READINESS.json',
            'products/JANUS.SEARCH.json',
            'BUYER_QUERY_PLANE.json',
            'MACHINE_INGRESS.json',
          }
          changed={x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x}
          if not changed or not changed <= allowed:
              raise SystemExit(f'WITNESS_EVIDENCE_FILE_ALLOWLIST_MISMATCH allowed={sorted(allowed)} actual={sorted(changed)}')
          forbidden={'PRICING.json','PAYMENT_POLICY.md','index.html'} & changed
          if forbidden:
              raise SystemExit(f'WITNESS_MUST_NOT_CHANGE_SELLER_AUTHORITY_SURFACES:{sorted(forbidden)}')
          print('WITNESS_EVIDENCE_CHANGED_FILE_ALLOWLIST=PASS')
          PY

      - name: Verify evidence candidate before branch push
        if: steps.witness.outputs.found == 'true' && steps.canonical.outputs.already_promoted != 'true'
        run: |
          python -m json.tool FOREIGN_AGENT_WITNESS.json >/dev/null
          python -m json.tool COMMERCE_READINESS.json >/dev/null
          python -m json.tool products/JANUS.SEARCH.json >/dev/null
          PYTHONPATH=. python tools/validate_buyer_query_plane.py
          python - <<'PY'
          import json
          w=json.load(open('FOREIGN_AGENT_WITNESS.json'))
          r=json.load(open('COMMERCE_READINESS.json'))
          p=json.load(open('products/JANUS.SEARCH.json'))
          assert w['foreign_agent_witness'] is True
          assert w['money_enabled'] is False
          assert w['witness_receipt_itself_enables_money'] is False
          assert r['seller_commerce_authorized'] is True
          assert r['money_enabled'] is True
          assert r['promotion_evidence']['seller_authority_changed'] is False
          assert p['machine_purchase'] is True and p['live_gate']['checkout_live'] is True
          assert p['live_gate']['foreign_agent_witness_is_seller_prerequisite'] is False
          print('WITNESS_EVIDENCE_CANDIDATE=PASS')
          print('SELLER_AUTHORITY_CHANGED_BY_WITNESS=FALSE')
          PY

      - name: Push deterministic evidence branch and open review PR
        if: steps.witness.outputs.found == 'true' && steps.canonical.outputs.already_promoted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WITNESS_ID: ${{ steps.witness.outputs.witness_id }}
          RECEIPT_HASH: ${{ steps.witness.outputs.receipt_hash }}
          MARKET_STATE_COMMIT: ${{ steps.witness.outputs.market_state_commit }}
        run: |
          set -euo pipefail
          suffix="${WITNESS_ID#faw-home-}"
          branch="evidence/foreign-agent-witness-${suffix:0:16}"
          existing="$(gh pr list --state all --head "$branch" --json number,state,url --limit 1)"
          if [ "$existing" != '[]' ]; then
            echo "WITNESS_EVIDENCE_PR_ALREADY_EXISTS=$existing"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo 'WITNESS_EVIDENCE_BRANCH_EXISTS_WITHOUT_PR_FAIL_CLOSED=TRUE' >&2
            exit 4
          fi
          git config user.name "JANUS Witness Evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add FOREIGN_AGENT_WITNESS.json COMMERCE_READINESS.json products/JANUS.SEARCH.json BUYER_QUERY_PLANE.json MACHINE_INGRESS.json
          git commit -m "Record persistent HOME foreign-agent witness ${WITNESS_ID}"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/witness-pr.md" <<EOF
          ## Foreign-agent witness evidence candidate

          - witness_id: \`${WITNESS_ID}\`
          - witness_receipt_hash: \`${RECEIPT_HASH}\`
          - market_state_commit: \`${MARKET_STATE_COMMIT}\`
          - seller commerce was already live before this evidence
          - this PR does **not** enable money
          - JANUS.INFERENCE / JANUS.COMPUTE remain closed

          This workflow does not auto-merge.
          EOF
          gh pr create --base main --head "$branch" --title "Evidence: record foreign-agent witness ${WITNESS_ID}" --body-file "$RUNNER_TEMP/witness-pr.md"
          echo 'WITNESS_EVIDENCE_PR=CREATED_REVIEW_REQUIRED'
